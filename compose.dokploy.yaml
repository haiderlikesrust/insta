services:
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - dokploy-network
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY_HOPS: "2"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your exact HTTPS origin}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: instara
      PGDATABASE: instara
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEV_WALLET_ADDRESS: ${DEV_WALLET_ADDRESS:-}
      MAIN_LAUNCH_ENABLED: ${MAIN_LAUNCH_ENABLED:-false}
      INSTARA_MINT: ${INSTARA_MINT:-}
      INSTARA_BUYBACK_POOL: ${INSTARA_BUYBACK_POOL:-}
      BUYBACK_SLIPPAGE_BPS: ${BUYBACK_SLIPPAGE_BPS:-100}
      SOLANA_LOOKUP_TABLES: ${SOLANA_LOOKUP_TABLES:-}
      BACKEND_WALLET_SECRET_KEY: ${BACKEND_WALLET_SECRET_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SOLANA_NETWORK: mainnet-beta
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      METEORA_CONFIG_KEY: ${METEORA_CONFIG_KEY:-}
      LIVE_LAUNCHES_ENABLED: ${LIVE_LAUNCHES_ENABLED:-false}
    networks:
      - app
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  settlement-worker:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    command: ["node", "settlement-worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      BACKEND_WALLET_SECRET_KEY: ${BACKEND_WALLET_SECRET_KEY:-}
      SETTLEMENT_ORIGIN: http://web:3000
    networks:
      - app

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: instara
      POSTGRES_DB: instara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long alphanumeric POSTGRES_PASSWORD}
    volumes:
      - instara-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instara -d instara"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  instara-postgres:

networks:
  dokploy-network:
    external: true
  app:
  database:
    internal: true
